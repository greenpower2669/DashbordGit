name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Cache Sherpa-ONNX and Kokoro
        uses: actions/cache@v4
        with:
          path: .ci-cache
          key: sherpa-onnx-1.13.8-kokoro-int8-multi-lang-v1_0
      - name: Bundle Sherpa-ONNX + Kokoro v1.0 French ff_siwis locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-cache app/libs app/src/main/assets
          AAR=.ci-cache/sherpa-onnx-1.13.8.aar
          MODEL=.ci-cache/kokoro-int8-multi-lang-v1_0.tar.bz2
          test -f "$AAR" || curl -fL --retry 4 --retry-delay 3 -o "$AAR" https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          test -f "$MODEL" || curl -fL --retry 4 --retry-delay 3 -o "$MODEL" https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-int8-multi-lang-v1_0.tar.bz2
          cp "$AAR" app/libs/sherpa-onnx-1.13.8.aar
          rm -rf app/src/main/assets/kokoro-int8-multi-lang-v1_0 /tmp/kokoro-int8-multi-lang-v1_0
          tar -xjf "$MODEL" -C /tmp
          mkdir -p app/src/main/assets/kokoro-int8-multi-lang-v1_0
          cp /tmp/kokoro-int8-multi-lang-v1_0/model.int8.onnx app/src/main/assets/kokoro-int8-multi-lang-v1_0/
          cp /tmp/kokoro-int8-multi-lang-v1_0/voices.bin app/src/main/assets/kokoro-int8-multi-lang-v1_0/
          cp /tmp/kokoro-int8-multi-lang-v1_0/tokens.txt app/src/main/assets/kokoro-int8-multi-lang-v1_0/
          cp /tmp/kokoro-int8-multi-lang-v1_0/LICENSE app/src/main/assets/kokoro-int8-multi-lang-v1_0/
          cp -a /tmp/kokoro-int8-multi-lang-v1_0/espeak-ng-data app/src/main/assets/kokoro-int8-multi-lang-v1_0/
          du -sh app/src/main/assets/kokoro-int8-multi-lang-v1_0 app/libs/sherpa-onnx-1.13.8.aar
      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DashbordGit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
