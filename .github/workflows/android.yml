name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Cache Sherpa-ONNX and Supertonic 3
        uses: actions/cache@v4
        with:
          path: .ci-cache
          key: sherpa-onnx-1.13.8-supertonic3-int8-82fa96f9
      - name: Bundle Sherpa-ONNX + Supertonic 3 INT8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-cache app/libs app/src/main/assets/tts
          AAR=.ci-cache/sherpa-onnx-1.13.8.aar
          MODEL=.ci-cache/sherpa-onnx-supertonic-3-tts-int8-2026-05-11.tar.bz2
          test -f "$AAR" || curl -fL --retry 4 --retry-delay 3 -o "$AAR" https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          echo "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  $AAR" | sha256sum -c -
          test -f "$MODEL" || curl -fL --retry 4 --retry-delay 3 -o "$MODEL" https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/sherpa-onnx-supertonic-3-tts-int8-2026-05-11.tar.bz2
          echo "82fa96f91c4ef8abaae3a14a3f4153facf88bed821d1f7331cec2700f432c427  $MODEL" | sha256sum -c -
          cp "$AAR" app/libs/sherpa-onnx-1.13.8.aar
          rm -rf app/src/main/assets/tts/piper app/src/main/assets/tts/supertonic3 /tmp/sherpa-onnx-supertonic-3-tts-int8-2026-05-11
          tar -xjf "$MODEL" -C /tmp
          mv /tmp/sherpa-onnx-supertonic-3-tts-int8-2026-05-11 app/src/main/assets/tts/supertonic3
          test -f app/src/main/assets/tts/supertonic3/duration_predictor.int8.onnx
          test -f app/src/main/assets/tts/supertonic3/text_encoder.int8.onnx
          test -f app/src/main/assets/tts/supertonic3/vector_estimator.int8.onnx
          test -f app/src/main/assets/tts/supertonic3/vocoder.int8.onnx
          test -f app/src/main/assets/tts/supertonic3/tts.json
          test -f app/src/main/assets/tts/supertonic3/unicode_indexer.bin
          test -f app/src/main/assets/tts/supertonic3/voice.bin
          du -sh app/src/main/assets/tts/supertonic3 app/libs/sherpa-onnx-1.13.8.aar
      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DashbordGit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
