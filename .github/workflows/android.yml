name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Cache Sherpa-ONNX and Piper UPMC
        uses: actions/cache@v4
        with:
          path: .ci-cache
          key: sherpa-onnx-1.13.8-piper-fr_FR-upmc-medium-e9830a33
      - name: Bundle Sherpa-ONNX + Piper UPMC Medium Pierre
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-cache app/libs app/src/main/assets/tts/piper
          AAR=.ci-cache/sherpa-onnx-1.13.8.aar
          MODEL=.ci-cache/vits-piper-fr_FR-upmc-medium.tar.bz2
          test -f "$AAR" || curl -fL --retry 4 --retry-delay 3 -o "$AAR" https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          echo "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  $AAR" | sha256sum -c -
          test -f "$MODEL" || curl -fL --retry 4 --retry-delay 3 -o "$MODEL" https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-fr_FR-upmc-medium.tar.bz2
          echo "e9830a331a16f6cc5ef3116a287065e015d3495c3f56b974889a266da7f89a7f  $MODEL" | sha256sum -c -
          cp "$AAR" app/libs/sherpa-onnx-1.13.8.aar
          rm -rf app/src/main/assets/tts/piper/pierre /tmp/vits-piper-fr_FR-upmc-medium
          tar -xjf "$MODEL" -C /tmp
          mv /tmp/vits-piper-fr_FR-upmc-medium app/src/main/assets/tts/piper/pierre
          test -f app/src/main/assets/tts/piper/pierre/fr_FR-upmc-medium.onnx
          test -f app/src/main/assets/tts/piper/pierre/tokens.txt
          test -d app/src/main/assets/tts/piper/pierre/espeak-ng-data
          du -sh app/src/main/assets/tts/piper/pierre app/libs/sherpa-onnx-1.13.8.aar
      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DashbordGit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
