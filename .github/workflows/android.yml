name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Cache Sherpa-ONNX + Piper + Supertonic 3 + MMS
        uses: actions/cache@v4
        with:
          path: .ci-cache
          key: sherpa-onnx-1.13.8-triple-piper-supertonic3-mms-v1
      - name: Bundle Piper Pierre + Supertonic 3 + MMS French
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-cache app/libs app/src/main/assets/tts

          AAR=.ci-cache/sherpa-onnx-1.13.8.aar
          PIPER=.ci-cache/vits-piper-fr_FR-upmc-medium.tar.bz2
          SUPER=.ci-cache/sherpa-onnx-supertonic-3-tts-int8-2026-05-11.tar.bz2
          MMS=.ci-cache/vits-mms-fra.tar.bz2

          test -f "$AAR" || curl -fL --retry 4 --retry-delay 3 -o "$AAR" https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          echo "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  $AAR" | sha256sum -c -

          test -f "$PIPER" || curl -fL --retry 4 --retry-delay 3 -o "$PIPER" https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-fr_FR-upmc-medium.tar.bz2
          echo "e9830a331a16f6cc5ef3116a287065e015d3495c3f56b974889a266da7f89a7f  $PIPER" | sha256sum -c -

          test -f "$SUPER" || curl -fL --retry 4 --retry-delay 3 -o "$SUPER" https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/sherpa-onnx-supertonic-3-tts-int8-2026-05-11.tar.bz2
          echo "82fa96f91c4ef8abaae3a14a3f4153facf88bed821d1f7331cec2700f432c427  $SUPER" | sha256sum -c -

          test -f "$MMS" || curl -fL --retry 4 --retry-delay 3 -o "$MMS" https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-mms-fra.tar.bz2
          test "$(stat -c%s "$MMS")" = "107713220"

          cp "$AAR" app/libs/sherpa-onnx-1.13.8.aar
          rm -rf app/src/main/assets/tts/piper app/src/main/assets/tts/supertonic3 app/src/main/assets/tts/mms
          rm -rf /tmp/vits-piper-fr_FR-upmc-medium /tmp/sherpa-onnx-supertonic-3-tts-int8-2026-05-11 /tmp/vits-mms-fra

          tar -xjf "$PIPER" -C /tmp
          mkdir -p app/src/main/assets/tts/piper
          mv /tmp/vits-piper-fr_FR-upmc-medium app/src/main/assets/tts/piper/pierre

          tar -xjf "$SUPER" -C /tmp
          mv /tmp/sherpa-onnx-supertonic-3-tts-int8-2026-05-11 app/src/main/assets/tts/supertonic3

          tar -xjf "$MMS" -C /tmp
          mkdir -p app/src/main/assets/tts/mms
          mv /tmp/vits-mms-fra app/src/main/assets/tts/mms/fra

          test -f app/src/main/assets/tts/piper/pierre/fr_FR-upmc-medium.onnx
          test -f app/src/main/assets/tts/piper/pierre/tokens.txt
          test -d app/src/main/assets/tts/piper/pierre/espeak-ng-data

          test -f app/src/main/assets/tts/supertonic3/duration_predictor.int8.onnx
          test -f app/src/main/assets/tts/supertonic3/text_encoder.int8.onnx
          test -f app/src/main/assets/tts/supertonic3/vector_estimator.int8.onnx
          test -f app/src/main/assets/tts/supertonic3/vocoder.int8.onnx
          test -f app/src/main/assets/tts/supertonic3/tts.json
          test -f app/src/main/assets/tts/supertonic3/unicode_indexer.bin
          test -f app/src/main/assets/tts/supertonic3/voice.bin

          test -f app/src/main/assets/tts/mms/fra/model.onnx
          test -f app/src/main/assets/tts/mms/fra/tokens.txt

          du -sh app/src/main/assets/tts/piper app/src/main/assets/tts/supertonic3 app/src/main/assets/tts/mms app/libs/sherpa-onnx-1.13.8.aar
      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DashbordGit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
