name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, feature/web-first-supertonic3-v1, feature/dashgit-chromium-mosaic-001, feature/dashgit-home-explorer-002, feature/dashgit-dom-scroll-consent-003, feature/djipie-audio-explorer-001, feature/djipie-fireworks-audio-v055, release/djipie-catalogue-main-v060 ]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fetch REAL GitHub public HTML fixtures and REST truth
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_real_github_actions_fixtures.py
      - name: Observe real GitHub pages in Chromium (no reload)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m pip install --user 'selenium==4.37.0'
          python3 scripts/probe_real_chromium_github.py
      - name: Validate optional dashboard status JSON
        run: python3 scripts/test_dashboardgit_snapshot.py
      - name: Cache Sherpa-ONNX and Supertonic 3 only
        uses: actions/cache@v4
        with:
          path: .ci-cache
          key: sherpa-onnx-1.13.8-supertonic3-int8-only-82fa96f9
      - name: Bundle Sherpa-ONNX and Supertonic 3 INT8 (French)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-cache app/libs app/src/main/assets/tts
          AAR=.ci-cache/sherpa-onnx-1.13.8.aar
          MODEL=.ci-cache/sherpa-onnx-supertonic-3-tts-int8-2026-05-11.tar.bz2
          test -f "$AAR" || curl -fL --retry 4 --retry-delay 3 -o "$AAR" https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          echo "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  $AAR" | sha256sum -c -
          test -f "$MODEL" || curl -fL --retry 4 --retry-delay 3 -o "$MODEL" https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/sherpa-onnx-supertonic-3-tts-int8-2026-05-11.tar.bz2
          echo "82fa96f91c4ef8abaae3a14a3f4153facf88bed821d1f7331cec2700f432c427  $MODEL" | sha256sum -c -
          cp "$AAR" app/libs/sherpa-onnx-1.13.8.aar
          rm -rf app/src/main/assets/tts
          mkdir -p app/src/main/assets/tts
          tar -xjf "$MODEL" -C /tmp
          mv /tmp/sherpa-onnx-supertonic-3-tts-int8-2026-05-11 app/src/main/assets/tts/supertonic3
          for name in duration_predictor.int8.onnx text_encoder.int8.onnx vector_estimator.int8.onnx vocoder.int8.onnx tts.json unicode_indexer.bin voice.bin; do
            test -f "app/src/main/assets/tts/supertonic3/$name"
          done
          test ! -e app/src/main/assets/tts/piper
          test ! -e app/src/main/assets/tts/mms
          ! grep -R -E "PierrePiperSpeech|MmsFrenchSpeech" app/src/main/java
          du -sh app/src/main/assets/tts/supertonic3 app/libs/sherpa-onnx-1.13.8.aar
      - name: Verify Web status parser and compile Android
        run: gradle :app:testDebugUnitTest :app:assembleDebug
      - name: Publish real-page validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DashbordGit-real-page-test-results
          path: |
            app/build/test-results/testDebugUnitTest
            app/build/reports/tests/testDebugUnitTest
            app/src/test/resources/github_live/manifest.json
          if-no-files-found: warn
      - name: Publish real Chromium observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DashbordGit-Chromium-real-observation
          path: build/chromium-live
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: DashbordGit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Verify installable direct APK after temporary unpacking
        if: github.ref == 'refs/heads/release/djipie-catalogue-main-v060' || github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dash-audio/packed" "$RUNNER_TEMP/dash-audio/unpacked" dist
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/dash-audio/packed/DashbordGit-v0.6.0-debug.apk"
          (cd "$RUNNER_TEMP/dash-audio/packed" && zip -0 -q "$RUNNER_TEMP/dash-audio/transport.zip" DashbordGit-v0.6.0-debug.apk)
          unzip -q "$RUNNER_TEMP/dash-audio/transport.zip" -d "$RUNNER_TEMP/dash-audio/unpacked"
          cmp -s app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/dash-audio/unpacked/DashbordGit-v0.6.0-debug.apk"
          unzip -tqq "$RUNNER_TEMP/dash-audio/unpacked/DashbordGit-v0.6.0-debug.apk"
          unzip -Z1 "$RUNNER_TEMP/dash-audio/unpacked/DashbordGit-v0.6.0-debug.apk" | grep -Fx 'AndroidManifest.xml'
          cp "$RUNNER_TEMP/dash-audio/unpacked/DashbordGit-v0.6.0-debug.apk" dist/
          sha256sum dist/DashbordGit-v0.6.0-debug.apk | tee dist/SHA256SUMS.txt
      - name: Deliver single APK unzipped via GitHub artifact v7
        if: github.ref == 'refs/heads/release/djipie-catalogue-main-v060' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          path: dist/DashbordGit-v0.6.0-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 30


  publish_release:
    name: GitHub Release v0.6.0
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download APK from this successful build
        uses: actions/download-artifact@v4
        with:
          name: DashbordGit-debug-apk
          path: dist
      - name: Publish tagged v0.6.0 GitHub Release with tested APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s dist/app-debug.apk
          mv dist/app-debug.apk dist/DashbordGit-v0.6.0-debug.apk
          sha256sum dist/DashbordGit-v0.6.0-debug.apk > dist/SHA256SUMS.txt
          if gh release view v0.6.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The v0.6.0 release already exists; no overwrite."
          else
            gh release create v0.6.0 \
              dist/DashbordGit-v0.6.0-debug.apk dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "DashbordGit v0.6.0 — sonothèque Djipie évolutive" \
              --notes-file docs/releases/v0.6.0.md \
          fi
